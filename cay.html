<canvas id="film" width="1080" height="1920"></canvas>
<script>
// Köyde Çay: 8 s silent vertical short. A man sits on a sedir in a warm village room in winter and drinks tea.
// Style: white round heads with two black oval eyes, white gloves, knitted clothes, painted backgrounds.
const W = 1080, H = 1920, FPS = 30, DURATION = 8, TOTAL = FPS * DURATION;
const INK = '#2a1c16';
const rng = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (f, a, b) => clamp((f - a) / (b - a));
const eio = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const sm = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };

// ---------- helpers ----------
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
function inkStroke(g, w = 5, a = 1) { g.save(); g.globalAlpha = a; g.lineWidth = w; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); g.restore(); }
function inkP(g, P, w = 5) { g.save(); g.lineWidth = w; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(P); g.restore(); }
/** painted blotches inside the current clip */
function paint(g, x, y, w, h, cols, n, seed, r0 = 6, r1 = 30, a = 0.08) {
  const r = rng(seed); g.save();
  for (let i = 0; i < n; i++) { g.globalAlpha = a * (0.4 + r()); g.fillStyle = cols[(r() * cols.length) | 0]; g.beginPath();
    const rr = r0 + r() * (r1 - r0); g.ellipse(x + r() * w, y + r() * h, rr, rr * (0.4 + r() * 0.5), r() * 3, 0, 7); g.fill(); }
  g.restore();
}
/** fill a Path2D with a fill style, then a soft left-lit / right-shadow gradient, then ink */
function shape(g, P, fill, bb, { ink = 5, shade = 0.32, hi = 0.14 } = {}) {
  g.fillStyle = fill; g.fill(P);
  if (shade || hi) { g.save(); g.clip(P); const gr = g.createLinearGradient(bb[0], bb[1], bb[2], bb[3]);
    gr.addColorStop(0, `rgba(255,226,180,${hi})`); gr.addColorStop(0.45, 'rgba(255,226,180,0)'); gr.addColorStop(0.6, 'rgba(30,20,50,0)'); gr.addColorStop(1, `rgba(30,20,50,${shade})`);
    g.fillStyle = gr; g.fillRect(bb[0] - 400, bb[1] - 400, bb[2] - bb[0] + 800, bb[3] - bb[1] + 800); g.restore(); }
  if (ink) inkP(g, P, ink);
}
// knitted wool pattern (V stitches), tweed and rib patterns; cached per context
const PCACHE = new Map();
function pats(g) {
  if (PCACHE.has(g)) return PCACHE.get(g);
  const knit = (base, dark, light, sc) => { const k = 3, tw = 22, th = 18, c = document.createElement('canvas'); c.width = tw * k; c.height = th * k; const x = c.getContext('2d'); x.scale(k, k);
    x.fillStyle = dark; x.fillRect(0, 0, tw, th);
    for (const oy of [-th, 0, th]) for (const [cx, rot] of [[tw * 0.27, -0.55], [tw * 0.73, 0.55]]) {
      x.save(); x.translate(cx, th / 2 + oy); x.rotate(rot); x.fillStyle = base; x.beginPath(); x.ellipse(0, 0, tw * 0.21, th * 0.62, 0, 0, 7); x.fill();
      x.strokeStyle = light; x.globalAlpha = .55; x.lineWidth = 1.4; x.beginPath(); x.ellipse(-1, -1, tw * 0.1, th * 0.42, 0, Math.PI * 1.05, Math.PI * 1.95); x.stroke(); x.restore(); }
    const p = g.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().scale(sc / k)); return p; };
  const tweed = (base, a, b) => { const k = 3, s = 16, c = document.createElement('canvas'); c.width = c.height = s * k; const x = c.getContext('2d'); x.scale(k, k);
    x.fillStyle = base; x.fillRect(0, 0, s, s); const r = rng(5);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { x.strokeStyle = (i + j) % 2 ? a : b; x.lineWidth = 1.3; x.beginPath(); const d = (i % 2 ? 1 : -1);
      x.moveTo(i * 4 + 0.5, j * 4 + (d > 0 ? 0.5 : 3.5)); x.lineTo(i * 4 + 3.5, j * 4 + (d > 0 ? 3.5 : 0.5)); x.stroke(); }
    for (let i = 0; i < 10; i++) { x.fillStyle = r() > .5 ? a : '#8a6a50'; x.fillRect(r() * s, r() * s, 1, 1); }
    const p = g.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().scale(0.7 / k)); return p; };
  const rib = (base, dark, sc) => { const k = 3, c = document.createElement('canvas'); c.width = 10 * k; c.height = 10 * k; const x = c.getContext('2d'); x.scale(k, k);
    x.fillStyle = base; x.fillRect(0, 0, 10, 10); x.fillStyle = dark; x.fillRect(0, 0, 10, 2.2); x.globalAlpha = .3; x.fillRect(0, 2.2, 1.2, 8); x.fillRect(5, 2.2, 1.2, 8);
    const p = g.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().scale(sc / k)); return p; };
  const o = {
    cardigan: knit('#83502e', '#4a2a17', '#b57d4f', 0.72),

    sock: knit('#e2cfa6', '#a88c62', '#fff2d8', 0.55),
    sweater: rib('#dcbf8f', '#b8955f', 1.4),
    cuff: rib('#7d4b2b', '#4a2a17', 1.1),
    cap: tweed('#5d4837', '#3d2e24', '#7c6550'),

}

    g.fillStyle = '#f6f8fc'; g.beginPath(); g.roundRect(x - 8, y - 14, w + 16, 20, 9); g.fill(); g.lineWidth = 2; g.stroke();
    g.fillStyle = '#c8d4ea'; g.fillRect(x - 6, y + 2, w + 12, 4);
    g.fillStyle = '#9a6a48'; g.fillRect(x + w * 0.7, y - 30, 10, 18); g.fillStyle = '#f6f8fc'; g.fillRect(x + w * 0.7 - 2, y - 32, 14, 5); };
  house(126, 640, 86, 70, 1); house(232, 618, 104, 92, 2); house(356, 646, 82, 64, 3);
  // snow ground and a dry stone wall with snow caps
  gr = g.createLinearGradient(0, 700, 0, 812); gr.addColorStop(0, '#f2f5fb'); gr.addColorStop(1, '#d6e0f0'); g.fillStyle = gr; g.fillRect(wx0, 705, 360, 120);
  { const r = rng(9); for (let x = wx0 - 10; x < wx1 + 10; x += 22) { const y = 742 + r() * 4; g.fillStyle = r() > .5 ? '#c99a6c' : '#b88a5e'; g.beginPath(); g.ellipse(x, y + 14, 13, 10, 0, 0, 7); g.fill(); g.lineWidth = 1.6; g.strokeStyle = INK; g.stroke();
    g.fillStyle = '#f7f9fd'; g.beginPath(); g.ellipse(x, y + 6, 12, 5, 0, Math.PI, 0); g.fill(); } }
  for (let i = 0; i < 18; i++) { g.fillStyle = 'rgba(120,140,190,.35)'; g.beginPath(); g.ellipse(150 + i * 17, 790 - (i % 3) * 6, 5, 3, 0, 0, 7); g.fill(); } // footprints
  // bare tree with snow on its branches
  const branch = (x, y, a, len, w, d, r) => { if (d === 0 || len < 4) return; const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    g.strokeStyle = '#5e4232'; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
    if (w > 2) { g.strokeStyle = 'rgba(250,252,255,.9)'; g.lineWidth = w * 0.4; g.beginPath(); g.moveTo(x, y - w * 0.4); g.lineTo(x2, y2 - w * 0.4); g.stroke(); }
    branch(x2, y2, a - 0.35 - r() * 0.3, len * 0.72, w * 0.68, d - 1, r); branch(x2, y2, a + 0.3 + r() * 0.3, len * 0.7, w * 0.66, d - 1, r); };
  branch(425, 820, -Math.PI / 2 - 0.12, 120, 12, 7, rng(21));
  g.restore();

  const wood = '#8a5530';
  g.fillStyle = wood; g.beginPath(); g.rect(88, 230, 386, 604); g.rect(wx0, wy0, wx1 - wx0, wy1 - wy0); g.fill('evenodd');
  g.save(); g.beginPath(); g.rect(88, 230, 386, 604); g.rect(wx0, wy0, wx1 - wx0, wy1 - wy0); g.clip('evenodd'); paint(g, 88, 230, 386, 604, ['#a56a3c', '#6e4024'], 260, 31, 3, 18, 0.25); g.restore();
  g.strokeStyle = INK; g.lineWidth = 4; g.strokeRect(88, 230, 386, 604); g.lineWidth = 3; g.strokeRect(wx0, wy0, wx1 - wx0, wy1 - wy0);
  for (const [x, y, w, h] of [[274, wy0, 14, wy1 - wy0], [wx0, 440, wx1 - wx0, 12], [wx0, 630, wx1 - wx0, 12]]) { g.fillStyle = wood; g.fillRect(x, y, w, h); g.lineWidth = 2.5; g.strokeRect(x, y, w, h); }
  g.save(); g.beginPath(); g.rect(wx0, wy0, wx1 - wx0, wy1 - wy0); g.clip(); g.globalAlpha = .14; g.fillStyle = '#fff';
  for (const o of [0, 50]) { g.beginPath(); g.moveTo(140 + o, 252); g.lineTo(180 + o, 252); g.lineTo(110 + o, 380); g.lineTo(110 + o, 330); g.fill(); } g.restore();
  // sill with a geranium pot
  g.fillStyle = '#f2dfc0'; g.fillRect(64, 832, 434, 30); g.fillStyle = 'rgba(80,50,30,.3)'; g.fillRect(70, 862, 422, 10); g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(64, 832, 434, 30);
  g.fillStyle = '#b8603a'; poly(g, [[372, 790], [418, 790], [412, 832], [378, 832]]); g.fill(); inkStroke(g, 3);
  for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#4f8a3e' : '#5f9e48'; g.beginPath(); g.ellipse(380 + i * 7, 778 - (i % 3) * 8, 13, 9, i, 0, 7); g.fill(); g.lineWidth = 2; g.stroke(); }
  for (const [x, y] of [[384, 752], [404, 758], [394, 742]]) { g.fillStyle = '#e0384a'; g.beginPath(); g.arc(x, y, 8, 0, 7); g.fill(); g.lineWidth = 2; g.stroke(); }

  // family photo
  g.fillStyle = '#6e4428'; g.fillRect(598, 250, 104, 130); g.strokeStyle = INK; g.lineWidth = 3; g.strokeRect(598, 250, 104, 130);
  g.fillStyle = '#d9c09a'; g.fillRect(610, 262, 80, 106); g.fillStyle = '#b89a72'; g.beginPath(); g.ellipse(650, 360, 26, 30, 0, Math.PI, 0); g.fill();
  g.fillStyle = '#f1e6d2'; g.beginPath(); g.ellipse(650, 312, 20, 22, 0, 0, 7); g.fill(); g.lineWidth = 2; g.stroke(); g.fillStyle = '#3a2a20'; g.beginPath(); g.ellipse(650, 296, 22, 9, 0, Math.PI, 0); g.fill();
  g.fillStyle = '#2a1c16'; g.beginPath(); g.ellipse(643, 316, 2.5, 4, 0, 0, 7); g.ellipse(657, 316, 2.5, 4, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(80,50,30,.5)'; g.beginPath(); g.moveTo(612, 248); g.lineTo(650, 214); g.lineTo(688, 248); g.stroke();
  // shelf with copper jug and plates

  for (const x of [576, 776]) { poly(g, [[x, 570], [x + 10, 570], [x + 10, 610]]); g.fillStyle = '#6a3e22'; g.fill(); inkStroke(g, 2.5); }
  for (const [x, c] of [[700, '#3d6ea8'], [752, '#b3402e']]) { g.fillStyle = '#f2ead8'; g.beginPath(); g.arc(x, 518, 32, 0, 7); g.fill(); inkStroke(g, 3); g.strokeStyle = c; g.lineWidth = 6; g.beginPath(); g.arc(x, 518, 24, 0, 7); g.stroke(); g.fillStyle = c; g.beginPath(); g.arc(x, 518, 8, 0, 7); g.fill(); }
  g.fillStyle = '#c4703a'; g.beginPath(); g.moveTo(588, 552); g.bezierCurveTo(570, 520, 584, 498, 600, 492); g.lineTo(596, 470); g.lineTo(626, 470); g.lineTo(622, 492); g.bezierCurveTo(640, 498, 650, 520, 632, 552); g.closePath(); g.fill(); inkStroke(g, 3);
  g.strokeStyle = '#f0a868'; g.lineWidth = 4; g.beginPath(); g.moveTo(592, 530); g.quadraticCurveTo(588, 508, 602, 498); g.stroke();
  g.beginPath(); g.moveTo(626, 475); g.quadraticCurveTo(660, 470, 650, 505); g.strokeStyle = INK; g.lineWidth = 4; g.stroke();
  // hanging lamp
  g.strokeStyle = INK; g.lineWidth = 3; g.beginPath(); g.moveTo(820, 96); g.lineTo(820, 166); g.stroke();
  const lg = g.createRadialGradient(820, 222, 0, 820, 222, 150); lg.addColorStop(0, 'rgba(255,224,150,.55)'); lg.addColorStop(1, 'rgba(255,224,150,0)'); g.fillStyle = lg; g.fillRect(660, 80, 320, 300);
  g.fillStyle = '#4c5a4a'; g.beginPath(); g.moveTo(812, 164); g.lineTo(828, 164); g.bezierCurveTo(866, 170, 880, 196, 884, 214); g.lineTo(756, 214); g.bezierCurveTo(760, 196, 774, 170, 812, 164); g.closePath(); g.fill(); inkStroke(g, 3.5);
  g.fillStyle = '#fff3c4'; g.beginPath(); g.ellipse(820, 220, 20, 11, 0, 0, 7); g.fill(); inkStroke(g, 2.5);

  const VP = [540, 480], fy0 = 1252;
  for (let i = -12; i < 22; i++) { const xb0 = -900 + i * 118, xb1 = xb0 + 118, k = (fy0 - VP[1]) / (H - VP[1]);
    const t0 = VP[0] + (xb0 - VP[0]) * k, t1 = VP[0] + (xb1 - VP[0]) * k, r = rng(100 + i);
    poly(g, [[t0, fy0], [t1, fy0], [xb1, H], [xb0, H]]); const c = ['#b06c3c', '#a5643a', '#bb7a46', '#9c5c34'][(i + 12) % 4]; g.fillStyle = c; g.fill();
    g.save(); g.clip(); g.strokeStyle = 'rgba(70,35,15,.25)'; g.lineWidth = 1.5;

  gr = g.createLinearGradient(0, fy0, 0, H); gr.addColorStop(0, 'rgba(40,20,20,.35)'); gr.addColorStop(0.3, 'rgba(40,20,20,0)'); g.fillStyle = gr; g.fillRect(0, fy0, W, H - fy0);
  g.fillStyle = '#5a3420'; g.fillRect(0, 1240, W, 16); g.beginPath(); g.moveTo(0, 1256); g.lineTo(W, 1256); inkStroke(g, 3, .7);

  // kilim on the floor (bilinear trapezoid)

<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head><body>
<canvas id="c" width="3000" height="1700"></canvas>
<script type="module">
import * as T from './toon.js'; import * as C from './chars.js';
const cv = document.getElementById('c'), g = cv.getContext('2d');
const mode = new URLSearchParams(location.search).get('m') || 'jonas';
g.fillStyle = '#f6f1e6'; g.fillRect(0, 0, cv.width, cv.height);
const draw = (spec, opts, x, y, s, label) => { g.save(); g.translate(x, y); g.scale(s, s); T.toonChar(new T.Pen(g), spec, opts); g.restore();
  if (label) { g.fillStyle = '#2a2230'; g.font = 'bold 40px DejaVu Sans'; g.textAlign = 'center'; g.fillText(label, x + 300 * s, y + 1040 * s); } };
g.fillStyle = '#2a2230'; g.font = 'bold 64px DejaVu Sans'; g.textAlign = 'left';
if (mode === 'jonas') {
  g.fillText('JONAS – Charakterblatt', 60, 90);
  draw(C.JONAS, { expr: 'happy' }, 40, 140, 1.15, 'vorne');
  draw(C.JONAS, { expr: 'neutral', turn: 0.55, look: 0.6 }, 640, 140, 1.15, '3/4');
  draw(C.JONAS, { expr: 'neutral', turn: 1, look: 1, L: 'hang', R: 'hang' }, 1240, 140, 1.15, 'Seite');
  draw(C.JONAS_LAB, { expr: 'tired' }, 1900, 520, 0.55, 'Labor');
  draw(C.JONAS_ROPE, { expr: 'determined' }, 2240, 520, 0.55, 'Tag 100');
  draw(C.JONAS_MEDAL, { expr: 'happy' }, 2580, 520, 0.55, 'Finale');
  const ex = ['goofy', 'shock', 'sleep', 'cry', 'smug', 'laugh'];
  ex.forEach((e, i) => draw(C.JONAS, { expr: e }, 1880 + i * 180, 1100, 0.3, e));
  [['#d8303a', 'T-Shirt'], ['#ffffff', 'Schürze'], ['#18141c', 'Haar'], ['#3b5f9e', 'Jeans'], ['#f4f4f4', 'Schuhe']].forEach(([c, n], i) => { g.fillStyle = c; g.strokeStyle = '#1a1416'; g.lineWidth = 5; g.fillRect(1900 + i * 200, 160, 120, 120); g.strokeRect(1900 + i * 200, 160, 120, 120); g.fillStyle = '#2a2230'; g.font = 'bold 30px DejaVu Sans'; g.textAlign = 'center'; g.fillText(n, 1960 + i * 200, 320); });
} else {
  g.fillText('Nebenfiguren', 60, 90);
  const L = [[C.MURAT, { expr: 'goofy', holdR: 'chips', R: 'reach' }, 'Murat'], [C.ALI, { expr: 'smug', holdR: 'knife', R: 'up' }, 'Ali'], [C.PAPA, { expr: 'smile' }, 'Papa'], [C.MAMA, { expr: 'happy' }, 'Mama'], [C.WEBER, { expr: 'stern', holdL: 'clip', L: 'reach' }, 'Dr. Weber'],
    [C.GUARD, { expr: 'stern' }, 'Bodyguard'], [C.HAZMAT, { expr: 'neutral' }, 'Labor'], [C.BUSDRIVER, { expr: 'shock' }, 'Busfahrer'], [C.OPA, { expr: 'worried' }, 'Opa'], [C.ROBE, { expr: 'goofy' }, 'Bademantel'], [C.woman(0), {}, ''], [C.woman(1), { expr: 'cry' }, ''], [C.woman(2), { expr: 'worried' }, ''], [C.woman(3), { expr: 'shock' }, '']];
  L.forEach(([s, o, n], i) => draw(s, o, 30 + (i % 7) * 420, 140 + Math.floor(i / 7) * 780, 0.68, n));
}
window.ok = 1;
</script></body></html>
